name: Link Check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.md'
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am
  workflow_dispatch:

jobs:
  link-check:
    name: Link Check
    uses: zavestudios/platform-pipelines/.github/workflows/link-check.yml@c7ff44185036d3d8eaf2bca1f80a960a3bf088d7 # main
    with:
      fail_on_error: false  # Don't block PRs, just warn